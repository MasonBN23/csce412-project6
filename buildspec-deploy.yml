
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt

  pre_build:
    commands:
      - mkdir -p results
      - export RELEASE_ID="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
      - test -n "$RELEASE_ID"
      - test -n "$SITE_BUCKET"
      - test -n "$SITE_URL"
      - test -n "$CLOUDFRONT_DISTRIBUTION_ID"
      - echo "Starting deployment for release $RELEASE_ID"

  build:
    commands:
      - |
        set -e
        export RELEASE_ID="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

        python -m scripts.build
        python -m scripts.deploy_and_verify

        echo "Deployment and verification completed"

  post_build:
    commands:
      - echo "DeployAndVerify stage completed"

artifacts:
  files:
    - 'results/**/*'
  discard-paths: no
  base-directory: .
