version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - python scripts/build.py
  build:
    commands:
      - python -m agents.run pipeline
      - python -m agents.run testing || { python -m agents.run diagnosis --evidence results/pytest.xml; exit 1; }
  post_build:
    commands:
      - echo 'Test result and agent evidence available in results/'
